[project]
name = "prism-eval"
version = "0.1.0"
description = "A benchmark for reading instructions out of a language model's activations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = { paths = ["LICENSE", "NOTICE"] }
authors = [
    { name = "Gilad Gressel" },
    { name = "Rahul Pankajakshan" },
    { name = "Julia Diament" },
    { name = "Efim Hudis" },
    { name = "Krishnashree Achuthan" },
    { name = "Yisroel Mirsky" },
]
keywords = ["interpretability", "ai-safety", "prompt-injection", "evaluation", "llm"]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "openai>=1.0",
    "bert-score>=0.3.13",
    "numpy>=1.24",
    "wandb>=0.16",
    "weave>=0.50",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "peft>=0.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "datasets>=2.14",
    "huggingface-hub>=0.20",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
prism-eval = "prism_eval.cli:cli"

[project.urls]
Repository = "https://github.com/Offensive-AI-Lab/prism-eval"
Paper = "https://arxiv.org/abs/2606.09563"
Training = "https://github.com/Offensive-AI-Lab/prism"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism_eval"]
