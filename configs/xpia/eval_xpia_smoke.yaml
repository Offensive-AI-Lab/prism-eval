# Twenty-record indirect prompt injection pipeline check.
# Build the corpus, then run:
#   python scripts/fetch_xpia_evals.py --smoke 20 -o data/eval_suite_xpia_smoke.json

experiment:
  name: prism_xpia_smoke
  notes: "Twenty-record indirect prompt injection pipeline check."
  tags: [xpia, smoke]
  weave_project: null            # set to "<entity>/<project>" to enable Weave tracing

suite:
  path: data/eval_suite_xpia_smoke.json
  settings: [AP]

runner:
  type: prism
  display_name: "PRISM (Qwen3.5-9B, GRPO)"
  checkpoint: ${PRISM_EVAL_CHECKPOINT_DIR}/prism-qwen3.5-9b-grpo.pt
  device: cuda

scoring:
  bertscore: false
  judge_llm: true
  adversarial_detection: true

annotation:
  emit_trace: true
  op_name: itm_annotate
  batch_size: 16
  max_batch_tokens: 16384  # length-aware batching (see eval_xpia.yaml)

evaluation:
  evaluation_name: prism_xpia_smoke
  publish_leaderboard: false
  leaderboard_name: prism_xpia_smoke
