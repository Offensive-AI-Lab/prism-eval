# Target-model generalisation row: the same PRISM method, GRPO-tuned
# released checkpoint for Ministral-3-8B.
experiment:
  name: ministral-3-8b-grpo
  notes: "PRISM trained against Ministral-3-8B-Instruct, hook layer 17."
  tags: [eval_suite_v2, prism, ministral3]
  weave_project: null            # set to "<entity>/<project>" to enable Weave tracing

suite:
  path: data/eval_suite_v2_final.json
  settings: [AP, HO, BC, BN]

runner:
  type: prism
  display_name: "PRISM (Ministral-3-8B, GRPO)"
  checkpoint: ${PRISM_EVAL_CHECKPOINT_DIR}/prism-ministral-3-8b-grpo.pt
  device: cuda

scoring:
  bertscore: false
  judge_llm: true
  adversarial_detection: true

annotation:
  emit_trace: true
  op_name: itm_annotate
  batch_size: 8   # 24GB rtx_3090 target — 16 OOMs with weights+KV at 8B

evaluation:
  evaluation_name: prism_eval_suite_v2_1000
  publish_leaderboard: true
  leaderboard_name: prism_main_leaderboard
