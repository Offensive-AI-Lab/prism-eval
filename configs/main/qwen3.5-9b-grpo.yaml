# PRISM, RL-tuned. The headline row.
#
# prism runner: hook layer 16, project the last 128 response-token
# activations into embedding space, prepend as soft tokens, decode with LoRA.
# Same architecture as configs/main/qwen3.5-9b-sft.yaml — the difference is the training
# recipe (GRPO on top of the SFT initialisation).

experiment:
  name: qwen3.5-9b-grpo
  notes: "PRISM trained against Qwen3.5-9B, hook layer 16. SFT followed by judge-guided GRPO."
  tags: [eval_suite_v2, prism, grpo]
  weave_project: null            # set to "<entity>/<project>" to enable Weave tracing

suite:
  path: data/eval_suite_v2_final.json
  settings: [AP, HO, BC, BN]

runner:
  type: prism
  display_name: "PRISM (Qwen3.5-9B, GRPO)"
  checkpoint: ${PRISM_EVAL_CHECKPOINT_DIR}/prism-qwen3.5-9b-grpo.pt
  device: cuda

scoring:
  bertscore: false
  judge_llm: true
  adversarial_detection: true

annotation:
  emit_trace: true
  op_name: itm_annotate
  batch_size: 16

evaluation:
  evaluation_name: prism_eval_suite_v2_1000
  publish_leaderboard: true
  leaderboard_name: prism_main_leaderboard
