# Activation-window ablation (reviewer request): where in the base response
# do we take activations from, and how many tokens do we need?
# All 24 window conditions share evaluation_name=prism_window_ablation and land
# on prism_window_ablation_leaderboard. Window/generation params are env-var overrides
# set by scripts/run_ablation_window.sh (runner _cfg comes from the
# checkpoint, so YAML can't carry them):
#   PRISM_EVAL_ACT_WINDOW_POS=middle PRISM_EVAL_BASE_GEN_MAX_NEW_TOKENS=768 (full response, middle 128)
# Checkpoint = released checkpoint.

experiment:
  name: pos_mid128
  notes: "Window ablation, released checkpoint: PRISM_EVAL_ACT_WINDOW_POS=middle PRISM_EVAL_BASE_GEN_MAX_NEW_TOKENS=768 (full response, middle 128)"
  tags: [eval_suite_v2, grpo, window_ablation, pos_middle]
  weave_project: null            # set to "<entity>/<project>" to enable Weave tracing

suite:
  path: data/eval_suite_v2_final.json
  settings: [AP, HO, BC, BN]

runner:
  type: prism
  display_name: "position mid 128"
  checkpoint: ${PRISM_EVAL_CHECKPOINT_DIR}/prism-qwen3.5-9b-grpo.pt
  device: cuda

scoring:
  bertscore: false
  judge_llm: true
  adversarial_detection: true

annotation:
  emit_trace: true
  op_name: itm_annotate
  batch_size: 16

evaluation:
  evaluation_name: prism_window_ablation
  publish_leaderboard: true
  leaderboard_name: prism_window_ablation_leaderboard
