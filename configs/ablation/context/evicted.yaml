# Extraction-context ablation: do response-position
# activations genuinely encode the instruction, or is attention copying it
# from prompt positions at extraction time? Base responses are identical in
# every condition (shared greedy cache); only what the activation forward
# pass can see varies, via PRISM_EVAL_ACT_CONTEXT set by
# scripts/run_ablation_context.sh (runner _cfg comes from the checkpoint,
# so YAML can't carry it).
#
# This run: evicted — the response is re-forwarded behind a neutral
# placeholder user turn ('...'); the instruction tokens are physically
# absent, simulating real context-window overflow. Compare against the
# text-only baseline: anything above it is latent response-state signal.
# Checkpoint = released checkpoint, reference window (last 128 of a 196-cap response).
#
# All 5 context conditions share evaluation_name=prism_context_ablation and
# land on prism_context_ablation_leaderboard (own board — do NOT reuse the main or
# window-ablation leaderboard names).

experiment:
  name: evicted
  notes: "Act-context ablation, released checkpoint: PRISM_EVAL_ACT_CONTEXT=evicted (prompt physically absent)"
  tags: [eval_suite_v2, grpo, act_context_ablation, ctx_evicted]
  weave_project: null            # set to "<entity>/<project>" to enable Weave tracing

suite:
  path: data/eval_suite_v2_final.json
  settings: [AP, HO, BC, BN]

runner:
  type: prism
  display_name: "context evicted"
  checkpoint: ${PRISM_EVAL_CHECKPOINT_DIR}/prism-qwen3.5-9b-grpo.pt
  device: cuda

scoring:
  bertscore: false
  judge_llm: true
  adversarial_detection: true

annotation:
  emit_trace: true
  op_name: itm_annotate
  batch_size: 16

evaluation:
  evaluation_name: prism_context_ablation
  publish_leaderboard: true
  leaderboard_name: prism_context_ablation_leaderboard
